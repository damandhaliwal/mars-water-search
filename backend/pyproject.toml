[project]
name = "mars-agents"
version = "0.1.0"
description = "Gemini rover search experiments with smolagents and LangGraph"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "pydantic==2.13.5", "pydantic-settings==2.15.0", "fastapi==0.141.1", "uvicorn==0.52.4", "smolagents[openai]==1.26.0", "langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.1", "python-dotenv==1.2.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.6", "mypy==2.3.1", "types-requests==2.33.0.20260906"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gemini'"
markers = ["gemini: live Gemini tests requiring GEMINI_API_KEY (incurs API usage)"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/mars_agents"]
